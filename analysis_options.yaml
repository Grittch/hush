include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unawaited_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    # Le regole assolute del progetto vanno verificate dal linter, non ricordate.
    - unawaited_futures
    - avoid_dynamic_calls
    - always_declare_return_types
    - prefer_final_locals
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - throw_in_finally
    - avoid_slow_async_io
    - test_types_in_equals
    - use_build_context_synchronously
